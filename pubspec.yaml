name: flutter_application_1
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0" # relaxed so GitHub Actions (Flutter stable) can run pub get

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Firebase ---
  firebase_core: ^3.5.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.2

  # --- Speech to Text (stable, Android v2 embedding) ---
  speech_to_text: ^7.2.0
  permission_handler: ^11.3.1

  # --- Recording (optional; keep if you need file capture) ---
  record: ^6.1.1

  # --- Text-to-Speech ---
  flutter_tts: ^3.8.3

  # --- UI / Markdown ---
  flutter_markdown: ^0.7.3+1

  # --- Utils ---
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
