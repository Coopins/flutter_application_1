name: flutter_application_1
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  # Match your lock's SDKs to avoid resolution drift
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.8

  # --- Firebase (pin to lock versions) ---
  firebase_core: 3.15.2
  firebase_auth: 5.7.0
  cloud_firestore: 5.6.12

  # --- Speech to Text / permissions (pin) ---
  speech_to_text: 7.3.0
  permission_handler: 11.4.0

  # --- Recording (optional; you already have it pinned in lock) ---
  record: 6.1.1

  # --- Text-to-Speech (pin) ---
  flutter_tts: 3.8.5

  # --- UI / Markdown (pin) ---
  flutter_markdown: 0.7.7+1

  # --- Utils (pin) ---
  http: 1.5.0
  path_provider: 2.1.5
  path: 1.9.1
  flutter_dotenv: 5.2.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - env/
