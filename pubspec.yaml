name: flutter_application_1
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- Core / utils ----
  uuid: ^4.2.2
  cupertino_icons: ^1.0.8
  http: 1.5.0
  http_parser: ^4.1.2
  flutter_dotenv: ^6.0.0
  path_provider: 2.1.5
  path: 1.9.1

  # ---- Firebase (pinned) ----
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1

  # ---- Permissions ----
  permission_handler: ^12.0.1

  # ---- Recording (used elsewhere) ----
  record: 6.1.1

  # ---- On-device ASR for CategoryChat ----
  speech_to_text: ^7.3.0

  # ---- TTS ----
  flutter_tts: ^4.2.3

  # ---- UI / playback ----
  flutter_markdown: 0.7.7+1
  audioplayers: ^6.5.1
  audio_session: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - env/
